name: SahiTol CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-docs:
    name: Documentation Integrity & Traceability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Validate documentation graph
        run: |
          python scripts/check_docs.py
          python scripts/test_doc_integrity.py

  test-api:
    name: Backend API Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        working-directory: services/api
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run pytest suite
        working-directory: services/api
        run: |
          pytest

  test-web:
    name: Web Frontend Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: apps/web
        run: npm ci
      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck
      - name: Unit tests
        working-directory: apps/web
        run: npm run test
      - name: Production build
        working-directory: apps/web
        run: npm run build

  test-android:
    name: Android Collector Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "microsoft"
      - name: Run Android unit tests
        working-directory: apps/android
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew test --stacktrace
          else
            echo "Gradle wrapper generation pending"
          fi
