[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sahitol-api"
version = "0.1.0"
description = "SahiTol core API: offline-first sync, indicative pricing, formal recycler matching and handover verification"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.31.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "sqlalchemy==2.0.35",
    "alembic==1.13.3",
    "psycopg[binary]==3.2.3",
    "geoalchemy2==0.15.2",
    "pyjwt[crypto]==2.9.0",
    "argon2-cffi==23.1.0",
    "httpx==0.27.2",
    "reportlab==4.2.5",
    "python-multipart==0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pandas==2.2.3",
    "numpy==1.26.4",
    "shapely==2.0.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = [".", "../.."]
asyncio_mode = "auto"
